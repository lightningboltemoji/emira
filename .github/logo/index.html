<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>emira logo</title>
  <style>
    :root { color-scheme: light dark; font: 13px/1.4 ui-monospace, Menlo, monospace; }
    body { margin: 0; padding: 24px; background: #f6f8fa; color: #24292f; }
    @media (prefers-color-scheme: dark) { body { background: #161b22; color: #c9d1d9; } }
    main { max-width: 1200px; margin: 0 auto; display: grid; gap: 16px; }
    .stages { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 800px) { .stages { grid-template-columns: 1fr; } }
    .stage { border-radius: 8px; overflow: hidden; }
    .stage.light { background: #ffffff; box-shadow: inset 0 0 0 1px #d0d7de; }
    .stage.dark { background: #0d1117; box-shadow: inset 0 0 0 1px #30363d; }
    .stage svg { display: block; width: 100%; height: auto; }
    .controls { display: flex; gap: 12px; align-items: center; }
    .controls input[type=range] { flex: 1; }
    button, select { font: inherit; }
    #time { min-width: 7ch; text-align: right; font-variant-numeric: tabular-nums; }
    ol { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
    li button { border: 1px solid #8884; background: none; color: inherit; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
    li button.current { background: #23a862; border-color: #23a862; color: #fff; }
    .hint { opacity: 0.6; }
  </style>
</head>
<body>
  <main>
    <div class="stages">
      <div class="stage light"></div>
      <div class="stage dark"></div>
    </div>
    <div class="controls">
      <button id="play">pause</button>
      <input id="scrub" type="range" min="0" step="0.001">
      <span id="time"></span>
      <select id="speed">
        <option value="0.25">¼×</option>
        <option value="0.5">½×</option>
        <option value="1" selected>1×</option>
      </select>
    </div>
    <ol id="steps"></ol>
    <p class="hint">space plays and pauses · ← → step a frame · click a step to jump to it · edits to scene.ts reload here</p>
  </main>
  <script type="module" src="./preview.ts"></script>
</body>
</html>
